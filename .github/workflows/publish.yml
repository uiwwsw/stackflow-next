name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const { name, version } = require("./package.json");
            if (name !== "@uiwwsw/stackflow-next" ||
                version !== process.env.RELEASE_VERSION ||
                !/^\d+\.\d+\.\d+(?:-[\da-zA-Z.-]+)?$/.test(version)) {
              throw new Error("Select the exact release version from package.json");
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Publish to npm
        run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish --access public --tag "$tag" --registry=https://registry.npmjs.org
